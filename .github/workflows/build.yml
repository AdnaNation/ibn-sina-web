name: Build verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-build:
    name: Unit tests and Next.js production build
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      ADMIN_SECRET: "ci-only-secret-not-for-real-use-0000000000000000"
      ADMIN_PASSWORD: "ci-only-password-not-for-real-use"
      ENABLE_PUBLIC_BOOKING: "false"
      ENABLE_DEMO: "false"
      MONGODB_URI: "mongodb://127.0.0.1:27017/?directConnection=true"
      MONGODB_DB: "ibnsina_queue_test"
      MONGODB_TEST_URI: "mongodb://127.0.0.1:27017/?directConnection=true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build production application
        run: npm run build
