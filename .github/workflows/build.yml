name: Build verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-build:
    name: Unit tests and Next.js production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      ADMIN_SECRET: "ci-only-secret-not-for-real-use-0000000000000000"
      ADMIN_PASSWORD: "ci-only-password-not-for-real-use"
      ENABLE_PUBLIC_BOOKING: "false"
      ENABLE_DEMO: "false"
      MONGODB_URI: "mongodb://127.0.0.1:27017/?replicaSet=rs0"
      MONGODB_DB: "ibnsina_queue_test"
      MONGODB_TEST_URI: "mongodb://127.0.0.1:27017/?replicaSet=rs0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Start MongoDB replica set
        run: |
          docker run -d --name ibnsina-mongodb -p 27017:27017 mongo:7 mongod --replSet rs0 --bind_ip_all
          for attempt in {1..30}; do
            if docker exec ibnsina-mongodb mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec ibnsina-mongodb mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]})'
          for attempt in {1..30}; do
            if docker exec ibnsina-mongodb mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB replica set did not become primary"
          exit 1

      - name: Run unit tests
        run: npm test

      - name: Build production application
        run: npm run build
